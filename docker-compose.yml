version: '3.8'

services:
  logsonar:
    build: .
    container_name: logsonar-app
    ports:
      - "8081:80"
    environment:
      - DOCKER_HOST=tcp://host.docker.internal:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./static:/app/static
      - ./app:/app
      - ./data:/app/data
    restart: unless-stopped