# LogSonar derrière Nginx, en HTTPS sur un sous-domaine.
#
# 1. Remplacez monitor.exemple.com par votre sous-domaine.
# 2. Choisissez la ligne proxy_pass selon votre installation (voir plus bas).
# 3. Copiez ce fichier : sudo cp logsonar.conf /etc/nginx/sites-available/
#    sudo ln -s /etc/nginx/sites-available/logsonar.conf /etc/nginx/sites-enabled/
# 4. Certificat :      sudo certbot --nginx -d monitor.exemple.com
# 5. Rechargez :       sudo nginx -t && sudo systemctl reload nginx
#
# Dans le .env de LogSonar : LOGSONAR_TRUSTED_PROXIES=172.16.0.0/12

server {
    listen 80;
    server_name monitor.exemple.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name monitor.exemple.com;

    # Lignes ajoutées par certbot :
    # ssl_certificate     /etc/letsencrypt/live/monitor.exemple.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/monitor.exemple.com/privkey.pem;

    # Recommandé : réserver l'interface à vos IP
    # allow 81.2.69.142;     # bureau
    # allow 10.8.0.0/24;     # VPN
    # deny all;

    client_max_body_size 1m;

    # Le middleware des applications passe par le réseau Docker interne :
    # inutile (et déconseillé) d'exposer ce point d'entrée sur Internet.
    location = /api/ingest {
        return 403;
    }

    location / {
        # Nginx installé sur le serveur (hors Docker) :
        proxy_pass http://127.0.0.1:8081;
        # Nginx dans Docker, sur le même réseau que LogSonar (mode B) :
        # proxy_pass http://logsonar:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (temps réel)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
