# ==================================================
#  LogSonar — docker-compose.prod.yml
#  Usage : docker compose -f docker-compose.prod.yml up -d --build
# ==================================================
version: "3.8"

networks:
  tikipay:
    external: true
    name: tikipay_default

services:
  logsonar:
    build: .
    container_name: logsonar-app
    restart: always
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data
    networks:
      - tikipay