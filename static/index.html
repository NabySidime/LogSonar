<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>LogSonar</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><i data-lucide="radar"></i></div>
      <div><div class="brand-name">LogSonar</div><div class="brand-sub" id="instance-host">—</div></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-page="overview"><i data-lucide="layout-dashboard"></i>Vue d'ensemble</a>
      <div class="nav-section">Surveillance</div>
      <a href="#/server" data-page="server"><i data-lucide="server"></i>Serveur</a>
      <a href="#/containers" data-page="containers"><i data-lucide="boxes"></i>Conteneurs</a>
      <a href="#/traffic" data-page="traffic"><i data-lucide="activity"></i>Trafic</a>
      <a href="#/logs" data-page="logs"><i data-lucide="square-terminal"></i>Logs en direct</a>
      <div class="nav-section">Sécurité</div>
      <a href="#/threats" data-page="threats"><i data-lucide="shield-alert"></i>Menaces</a>
      <a href="#/vulns" data-page="vulns"><i data-lucide="bug"></i>Vulnérabilités</a>
      <a href="#/alerts" data-page="alerts"><i data-lucide="bell"></i>Alertes<span class="count hidden" id="nav-alerts"></span></a>
      <a href="#/reports" data-page="reports"><i data-lucide="file-text"></i>Rapports</a>
      <div class="nav-section">Administration</div>
      <a href="#/settings" data-page="settings"><i data-lucide="settings"></i>Paramètres</a>
      <a href="#/users" data-page="users" class="admin-only"><i data-lucide="users"></i>Utilisateurs</a>
    </nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" id="me-avatar">?</div>
        <div style="min-width:0"><div class="name" id="me-name">—</div><div class="role" id="me-role"></div></div>
      </div>
      <div class="row">
        <button class="btn ghost sm" data-action="theme" title="Changer de thème"><i data-lucide="sun-moon"></i><span id="theme-label">Thème</span></button>
        <button class="btn ghost sm" data-action="logout" title="Déconnexion"><i data-lucide="log-out"></i>Quitter</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn icon ghost menu-btn" data-action="menu" aria-label="Menu"><i data-lucide="menu"></i></button>
      <div style="min-width:0">
        <h1 id="page-title">—</h1>
        <div class="sub" id="page-sub"></div>
      </div>
      <div class="topbar-actions">
        <div id="page-actions" class="row"></div>
        <span class="live" id="live" title="Connexion temps réel"><span class="dot"></span><span class="txt">Connexion…</span></span>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="overlay-root"></div>
<script src="/static/vendor/lucide.min.js"></script>
<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/js/core.js"></script>
<script src="/static/js/pages-monitoring.js"></script>
<script src="/static/js/pages-security.js"></script>
<script src="/static/js/pages-admin.js"></script>
</body>
</html>
